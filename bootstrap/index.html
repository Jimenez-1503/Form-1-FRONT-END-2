<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TechFood — Sabor & Saber (Bootstrap)</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

  <header class="bg-danger text-white text-center py-4 mb-4 shadow-sm">
    <h1 class="fw-bold">Sabor &amp; Saber</h1>
    <p class="mb-0">Cardápio digital</p>
  </header>

  <main class="container flex-grow-1 mb-5">
    <h2 class="h3 border-bottom pb-2 mb-4">Nosso Cardápio</h2>

    <section id="cardapio" class="row g-3">
      
      <article class="col-12 col-md-6 col-lg-4">
        <div class="card h-100 shadow-sm border-0">
          <div class="card-body d-flex flex-column justify-content-between">
            <div>
              <h3 class="card-title h5 font-bold">Hambúrguer Artesanal</h3>
              <p class="card-text text-muted small">Pão brioche, 180g de carne bovina, queijo cheddar e molho especial.</p>
            </div>
            <div class="d-flex justify-content-between align-items-center mt-3">
              <span class="fw-bold text-danger fs-5">R$ 34,90</span>
              <button class="btn btn-danger btn-sm">Adicionar</button>
            </div>
          </div>
        </div>
      </article>

    </section>
  </main>

  <footer class="bg-white border-top py-3 text-center text-muted small">
    <small>TechFood · Aula 1 Bootstrap · Prof. Marlon</small>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js" defer></script>
</body>
</html>
