<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TechFood — Sabor & Saber (Tailwind)</title>
  <link rel="stylesheet" href="output.css">
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen flex flex-col justify-between">

  <header class="bg-red-600 text-white text-center py-6 shadow-md">
    <h1 class="text-3xl font-bold tracking-tight">Sabor &amp; Saber</h1>
    <p class="text-red-100 text-sm mt-1">Cardápio digital</p>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-8 w-full flex-grow">
    <h2 class="text-2xl font-bold mb-6 text-gray-800 border-b pb-2">Nosso Cardápio</h2>

    <section id="cardapio" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      
      <article class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden flex flex-col justify-between">
        <div class="p-5">
          <h3 class="text-lg font-bold text-gray-800">Hambúrguer Artesanal</h3>
          <p class="text-gray-600 text-sm mt-2">Pão brioche, 180g de carne bovina, queijo cheddar e molho especial.</p>
        </div>
        <div class="p-5 pt-0 flex justify-between items-center">
          <span class="text-lg font-bold text-red-600">R$ 34,90</span>
          <button class="bg-red-600 hover:bg-red-700 text-white text-sm font-medium py-2 px-4 rounded-lg transition-colors">
            Adicionar
          </button>
        </div>
      </article>

    </section>
  </main>

  <footer class="bg-white border-t border-gray-200 py-4 text-center text-xs text-gray-500">
    <small>TechFood · Aula 1 Tailwind · Prof. Marlon</small>
  </footer>

  <script src="script.js" defer></script>
</body>
</html>
